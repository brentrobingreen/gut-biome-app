<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Flip</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      gap: 32px;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    /* Coin */
    .coin-container {
      perspective: 600px;
      width: 160px;
      height: 160px;
    }

    .coin {
      width: 160px;
      height: 160px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s;
    }

    .coin.flipping {
      animation: flip 1.2s ease-out forwards;
    }

    @keyframes flip {
      0%   { transform: rotateY(0); }
      20%  { transform: rotateY(360deg) translateY(-20px); }
      40%  { transform: rotateY(720deg) translateY(-40px); }
      60%  { transform: rotateY(1080deg) translateY(-20px); }
      80%  { transform: rotateY(1440deg) translateY(0); }
      100% { transform: rotateY(var(--end-rotation)); }
    }

    .face {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 900;
      border: 6px solid;
      box-shadow: inset 0 4px 12px rgba(255,255,255,0.2), 0 8px 32px rgba(0,0,0,0.5);
      user-select: none;
    }

    .heads {
      background: radial-gradient(circle at 40% 35%, #ffe066, #f5a623, #b8860b);
      border-color: #f5a623;
      color: #7a4f00;
    }

    .tails {
      background: radial-gradient(circle at 40% 35%, #e0e0e0, #bdbdbd, #757575);
      border-color: #bdbdbd;
      color: #333;
      transform: rotateY(180deg);
    }

    /* Score */
    .score {
      display: flex;
      gap: 48px;
      background: rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 16px 40px;
      font-size: 1.1rem;
    }

    .score-item { text-align: center; }
    .score-item .label { opacity: 0.6; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .score-item .value { font-size: 2rem; font-weight: 700; }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 16px;
    }

    button {
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-heads {
      background: linear-gradient(135deg, #ffe066, #f5a623);
      color: #7a4f00;
      box-shadow: 0 4px 20px rgba(245, 166, 35, 0.4);
    }

    .btn-heads:not(:disabled):hover { box-shadow: 0 6px 28px rgba(245, 166, 35, 0.6); transform: translateY(-2px); }

    .btn-tails {
      background: linear-gradient(135deg, #e0e0e0, #9e9e9e);
      color: #333;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .btn-tails:not(:disabled):hover { box-shadow: 0 6px 28px rgba(0,0,0,0.4); transform: translateY(-2px); }

    /* Result message */
    .result {
      font-size: 1.4rem;
      font-weight: 600;
      min-height: 2rem;
      text-align: center;
      transition: opacity 0.3s;
      letter-spacing: 0.03em;
    }

    .result.win  { color: #69f0ae; text-shadow: 0 0 12px rgba(105,240,174,0.5); }
    .result.lose { color: #ff5252; text-shadow: 0 0 12px rgba(255,82,82,0.5); }

    /* Reset */
    .btn-reset {
      background: transparent;
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 20px;
      font-size: 0.8rem;
    }

    .btn-reset:not(:disabled):hover { color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <h1>Coin Flip</h1>

  <div class="coin-container">
    <div class="coin" id="coin">
      <div class="face heads">H</div>
      <div class="face tails">T</div>
    </div>
  </div>

  <div class="score">
    <div class="score-item">
      <div class="label">Wins</div>
      <div class="value" id="wins">0</div>
    </div>
    <div class="score-item">
      <div class="label">Losses</div>
      <div class="value" id="losses">0</div>
    </div>
    <div class="score-item">
      <div class="label">Streak</div>
      <div class="value" id="streak">0</div>
    </div>
  </div>

  <div class="result" id="result">Pick heads or tails!</div>

  <div class="buttons">
    <button class="btn-heads" id="btnHeads" onclick="flip('heads')">Heads</button>
    <button class="btn-tails" id="btnTails" onclick="flip('tails')">Tails</button>
  </div>

  <button class="btn-reset" onclick="resetScore()">Reset Score</button>

  <script>
    let wins = 0, losses = 0, streak = 0;
    let flipping = false;

    function flip(choice) {
      if (flipping) return;
      flipping = true;

      const coin = document.getElementById('coin');
      const result = Math.random() < 0.5 ? 'heads' : 'tails';

      // heads lands on 0/360/720... (face visible), tails on 180/540/900... (back visible)
      const baseSpins = (5 + Math.floor(Math.random() * 4)) * 360;
      const endOffset = result === 'heads' ? 0 : 180;
      const endRotation = baseSpins + endOffset;

      coin.style.setProperty('--end-rotation', `${endRotation}deg`);

      document.getElementById('btnHeads').disabled = true;
      document.getElementById('btnTails').disabled = true;
      document.getElementById('result').className = 'result';
      document.getElementById('result').textContent = 'Flipping...';

      coin.classList.remove('flipping');
      void coin.offsetWidth; // force reflow
      coin.classList.add('flipping');

      setTimeout(() => {
        const won = choice === result;

        if (won) {
          wins++;
          streak = streak >= 0 ? streak + 1 : 1;
        } else {
          losses++;
          streak = streak <= 0 ? streak - 1 : -1;
        }

        document.getElementById('wins').textContent = wins;
        document.getElementById('losses').textContent = losses;
        document.getElementById('streak').textContent = streak > 0 ? `+${streak}` : streak;

        const resultEl = document.getElementById('result');
        resultEl.textContent = won
          ? `It's ${result.toUpperCase()}! You win!`
          : `It's ${result.toUpperCase()}! You lose.`;
        resultEl.className = 'result ' + (won ? 'win' : 'lose');

        document.getElementById('btnHeads').disabled = false;
        document.getElementById('btnTails').disabled = false;
        flipping = false;
      }, 1300);
    }

    function resetScore() {
      wins = 0; losses = 0; streak = 0;
      document.getElementById('wins').textContent = 0;
      document.getElementById('losses').textContent = 0;
      document.getElementById('streak').textContent = 0;
      document.getElementById('result').className = 'result';
      document.getElementById('result').textContent = 'Pick heads or tails!';
    }
  </script>
</body>
</html>
